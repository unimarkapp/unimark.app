services:
  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    container_name: unimark-server
    hostname: server
    restart: always
    env_file:
      - .env
    ports:
      - 3000:3000
    depends_on:
      - database

  database:
    image: postgres:17.2-alpine
    restart: always
    container_name: unimark-database
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - ./.postgres:/var/lib/postgresql/data
